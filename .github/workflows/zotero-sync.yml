name: Zotero sync
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      full:
        description: Full resync (ignore stored library version)
        type: boolean
        default: false
      retry_missing:
        description: Retry fulltext lookup for metadata-only items
        type: boolean
        default: false
permissions:
  contents: write
concurrency: zotero-sync
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sync
        env:
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_LIBRARY_ID: ${{ secrets.ZOTERO_LIBRARY_ID }}
          ZOTERO_LIBRARY_TYPE: ${{ vars.ZOTERO_LIBRARY_TYPE || 'user' }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
        run: python scripts/zotero_sync.py ${{ inputs.full && '--full' || '' }} ${{ inputs.retry_missing && '--retry-missing' || '' }}
      - name: Commit
        run: |
          git config user.name "zotero-sync[bot]"
          git config user.email "zotero-sync@users.noreply.github.com"
          git add -A papers .state
          git diff --cached --quiet || (git commit -m "Zotero sync $(date -u +%F)" && git push)
