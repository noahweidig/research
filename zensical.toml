[project]
site_name = "Research knowledge base"
site_description = "Wildfire, ecology, and policy research: paper summaries and living syntheses."
site_url = "https://noahweidig.github.io/research/"
repo_url = "https://github.com/noahweidig/research"
repo_name = "noahweidig/research"

nav = [
  { "Home" = "index.md" },
  { "Syntheses" = "syntheses/index.md" },
  { "Paper summaries" = "summaries/index.md" },
]

[project.theme]
language = "en"
favicon = "assets/favicon.svg"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.path",
  "navigation.top",
  "search.highlight",
]

[project.theme.icon]
logo = "lucide/flask-conical"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.superfences = {}
